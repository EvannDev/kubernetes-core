# Corefile du cluster.
#
# HISTORIQUE : POURQUOI CE FICHIER EXISTE
# ---------------------------------------
# Tant que la plateforme était exposée en `*.127.0.0.1.nip.io:8080`, l'issuer
# OIDC était une chaîne unique utilisée par deux acteurs qui ne sont pas sur le
# même réseau : le NAVIGATEUR sur le Mac, et ARGO CD SERVER dans un pod, qui
# appelle .well-known/openid-configuration en backchannel. Or nip.io résout vers
# 127.0.0.1 : depuis le pod, c'était LE POD LUI-MÊME. Argo CD s'interrogeait donc
# lui-même et son serveur web répondait un 404 gzippé :
#
#   failed to query provider "http://keycloak.127.0.0.1.nip.io:8080/realms/platform":
#   404 Not Found: <octets gzip>
#
# La correction était un DNS à double horizon : une ligne
# `rewrite name keycloak.127.0.0.1.nip.io kc-service.keycloak.svc.cluster.local`
# qui donnait au cluster sa propre réponse pour ce nom.
#
# POURQUOI LA RÉÉCRITURE A ÉTÉ RETIRÉE
# ------------------------------------
# Depuis le passage à `https://idp.evann-deb.fr`, le problème d'origine a
# disparu : le nom résout vers Pangolin, pas vers 127.0.0.1, donc un pod qui
# l'appelle atteint bien Keycloak (via le tunnel Newt, en épingle à cheveux).
#
# Et surtout, la réécriture est devenue IMPOSSIBLE à conserver telle quelle :
# l'issuer est maintenant en https, alors que kc-service écoute en clair sur
# 8080 (spec.http.httpEnabled dans le CR Keycloak, TLS terminé par Pangolin).
# Rediriger le nom vers le Service ferait tenter une poignée de main TLS contre
# un serveur en clair. La rétablir supposerait de servir le certificat de
# idp.evann-deb.fr à l'intérieur du cluster — hors sujet ici.
#
# CONSÉQUENCE ASSUMÉE : le backchannel OIDC d'Argo CD et d'Open WebUI sort sur
# Internet et revient par le tunnel. Si le tunnel est coupé, le SSO tombe — mais
# l'interface aussi, puisqu'elle passe par le même chemin. Pas de mode dégradé
# nouveau.
#
# POURQUOI GARDER LE FICHIER
# --------------------------
# Il est désormais une COPIE CONFORME du Corefile généré par kubeadm/kind, sans
# aucun ajout. Le supprimer ne casserait rien tout de suite — l'Application est
# en `prune: false`, le ConfigMap survivrait — mais il repasserait hors gestion,
# à dériver en silence. Le garder sous Argo CD conserve un état connu et laisse
# le point d'extension prêt si un futur cluster redemande un horizon interne.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
