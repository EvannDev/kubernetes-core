apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay "lab" de Keycloak. La base ne contient aucune URL réelle : tout ce qui
# est spécifique au cluster est un patch ici. C'est la section 3.1 du ebook
# (garder la base DRY, stocker les deltas en overlays).
resources:
- ../../../base/keycloak

patches:
# --- URL publique de Keycloak ------------------------------------------------
# Doit être identique à l'issuer configuré côté Argo CD (values/argocd.yaml)
# et côté AgentgatewayPolicy (clusters/lab/agentgateway).
#
# https bien que Keycloak écoute en clair : le TLS est terminé par Pangolin, et
# spec.proxy.headers: xforwarded (dans la base) fait confiance au
# X-Forwarded-Proto qui en découle. Sans ce couple hostname-https / xforwarded,
# Keycloak annoncerait des URLs en http dans son document de découverte et les
# navigateurs refuseraient la redirection.
- target:
    group: k8s.keycloak.org
    kind: Keycloak
    name: kc
  patch: |
    - op: replace
      path: /spec/hostname/hostname
      value: https://idp.evann-deb.fr

# --- Hostname de la HTTPRoute ------------------------------------------------
# Gateway API compare le Host sans le schéma : pas de https:// ici.
- target:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: keycloak
  patch: |
    - op: replace
      path: /spec/hostnames/0
      value: idp.evann-deb.fr

# --- URLs de retour du client Argo CD ----------------------------------------
# clients/0 = "argocd" dans base/keycloak/realm-platform.yaml.
- target:
    group: k8s.keycloak.org
    kind: KeycloakRealmImport
    name: platform
  patch: |
    - op: replace
      path: /spec/realm/clients/0/rootUrl
      value: https://argocd.evann-deb.fr
    - op: replace
      path: /spec/realm/clients/0/redirectUris
      value:
      - https://argocd.evann-deb.fr/auth/callback
      - https://argocd.evann-deb.fr/pkce/verify
    - op: replace
      path: /spec/realm/clients/0/webOrigins
      value:
      - https://argocd.evann-deb.fr

# --- URLs de retour du client Open WebUI -------------------------------------
# clients/1 = "open-webui" dans base/keycloak/realm-platform.yaml.
- target:
    group: k8s.keycloak.org
    kind: KeycloakRealmImport
    name: platform
  patch: |
    - op: replace
      path: /spec/realm/clients/1/rootUrl
      value: https://openwebui.evann-deb.fr
    - op: replace
      path: /spec/realm/clients/1/redirectUris
      value:
      - https://openwebui.evann-deb.fr/oauth/oidc/callback
    - op: replace
      path: /spec/realm/clients/1/webOrigins
      value:
      - https://openwebui.evann-deb.fr
