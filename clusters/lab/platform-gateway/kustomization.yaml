apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../../base/platform-gateway

# Le listener reste sur le port 80 de la base : plus de patch ici.
#
# Il était patché en 8080 tant que Cilium exposait la Gateway en host network —
# Envoy binde alors le port du listener sur le nœud, et descendre sous 1024
# aurait exigé envoy.securityContext.capabilities.keepCapNetBindService=true.
# Depuis que Newt joint la Gateway par son ClusterIP, le port du listener est un
# port de Service : 80 ne pose aucun problème de capability.
patches:
- target:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: argocd
  patch: |
    - op: replace
      path: /spec/hostnames/0
      value: argocd.evann-deb.fr

- target:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: hubble
  patch: |
    - op: replace
      path: /spec/hostnames/0
      value: hubble.evann-deb.fr
