# Serveur MCP Argo CD, exposé via la Gateway IA avec RBAC outil par outil.
#
# Wave 45 : après Argo CD (5), après la passerelle et sa configuration (30), et
# après la Gateway de plateforme (40).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-mcp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "45"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/EvannDev/kubernetes-core.git
    targetRevision: main
    path: clusters/lab/argocd-mcp
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
