# CRD Gateway API — PROPRIÉTAIRE UNIQUE.
#
# Ni Cilium ni AgentGateway n'installent ces CRD (les deux documentations
# demandent de les pré-installer). Il y a donc zéro conflit de propriété par
# construction, à condition qu'une SEULE Application les applique : celle-ci.
#
# v1.6.1 satisfait à la fois le plancher d'AgentGateway (v1.6, avec TCPRoute
# passé en v1) et le niveau supporté par Cilium 1.19.
#
# CANAL EXPERIMENTAL, ET C'EST OBLIGATOIRE ICI — pas un confort.
#
# Le contrôleur Gateway API de Cilium 1.19 construit un index de champ sur
# TLSRoute en `gateway.networking.k8s.io/v1alpha2`. Or, dans Gateway API v1.6,
# le canal STANDARD ne sert plus cette version :
#
#   standard      TLSRoute -> v1 (servie), v1alpha2 (served: false)
#   experimental  TLSRoute -> v1, v1alpha2, v1alpha3 (toutes servies)
#
# Avec le canal standard, le cilium-operator plante au démarrage :
#   failed to create gateway controller: failed to setup reconciler:
#   failed to setup field indexer "backendServiceTLSRouteIndex":
#   no matches for kind "TLSRoute" in version "gateway.networking.k8s.io/v1alpha2"
#
# Le canal experimental est un SUR-ENSEMBLE strict : il sert v1 pour tout, donc
# AgentGateway n'est pas affecté (et l'on n'active pas pour autant ses features
# expérimentales, qui dépendent d'une variable d'environnement dédiée).
# Il ajoute XBackendTrafficPolicy et XMesh (groupe gateway.networking.x-k8s.io),
# inutilisés ici mais inertes.
#
# Alternative : canal standard + le seul CRD TLSRoute experimental. Cela évite
# deux CRD superflues au prix de deux canaux à faire évoluer ensemble à chaque
# montée de version. Choix retenu : un seul canal, une seule décision.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: network
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.1
    path: config/crd/experimental
  destination:
    server: https://kubernetes.default.svc
    # Ces CRD sont cluster-scoped ; le namespace n'a pas d'effet, il sert
    # uniquement à satisfaire la liste destinations de l'AppProject.
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false      # on ne supprime jamais des CRD partagées par erreur
      selfHeal: true
    syncOptions:
    # Obligatoire : ces CRD dépassent largement les 262 kB de l'annotation
    # last-applied-configuration du client-side apply.
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
