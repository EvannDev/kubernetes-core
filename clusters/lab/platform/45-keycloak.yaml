# Instance Keycloak + realm "platform" : Postgres, CR Keycloak,
# KeycloakRealmImport et la HTTPRoute d'exposition.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: identity
  source:
    repoURL: https://github.com/EvannDev/kubernetes-core.git
    targetRevision: main
    path: clusters/lab/keycloak
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  # Le Job d'import de realm est créé par l'opérateur, pas par Git : on ignore
  # son existence pour éviter un OutOfSync permanent.
  ignoreDifferences:
  - group: batch
    kind: Job
    jsonPointers:
    - /spec/template/metadata/labels
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 10m
