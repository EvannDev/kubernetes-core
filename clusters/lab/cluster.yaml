# Fiche d'identité du cluster. C'est CE fichier que l'ApplicationSet
# "clusters" (bootstrap/) découvre : ajouter un cluster = ajouter un dossier
# clusters/<nom>/ contenant un cluster.yaml et un dossier platform/.
#
# Les champs sont libres ; seul "name" est utilisé par le template de
# l'ApplicationSet. Les autres documentent le cluster et servent de référence
# unique quand on écrit les overlays.
name: lab
server: https://kubernetes.default.svc
distribution: kind
domain: evann-deb.fr
# Port du listener de la Gateway de plateforme. Les cibles Newt configurées dans
# Pangolin visent cilium-gateway-platform.platform-gateway.svc.cluster.local
# sur ce port.
externalPort: 80
description: Cluster de démonstration Lunch and Learn - gouvernance IA
