# Valeurs argo-cd propres au cluster "lab".
#
# Les URLs sont publiques et en https : le TLS est terminé par Pangolin, qui
# transporte le trafic jusqu'à la Gateway via le tunnel Newt. Argo CD lui-même
# reste en clair derrière (server.insecure: true dans base/argocd/values.yaml),
# ce qui est la configuration attendue derrière un reverse proxy terminant TLS.
global:
  domain: argocd.evann-deb.fr

configs:
  cm:
    # Le chart calcule un preset url = "https://<global.domain>", qui donnerait
    # déjà la bonne valeur. On la garde explicite : c'est l'URL que Keycloak doit
    # retrouver à l'identique dans redirectUris, et elle mérite d'être lisible
    # ici plutôt que déduite.
    url: https://argocd.evann-deb.fr

    # Client PUBLIC + PKCE : aucun client secret à gérer, donc rien à
    # provisionner dans argocd-secret et aucun secret dans Git.
    # Variante client confidentiel + External Secrets : cf. ARCHITECTURE.md.
    oidc.config: |
      name: Keycloak
      issuer: https://idp.evann-deb.fr/realms/platform
      clientID: argocd
      enablePKCEAuthentication: true
      requestedScopes:
      - openid
      - profile
      - email
      - groups
      refreshTokenThreshold: 2m
