# Valeurs Cilium propres au cluster "lab" (kind, mono-nœud).
#
# kubeProxyReplacement impose de dire à Cilium comment joindre l'API server
# sans passer par le Service ClusterIP (que kube-proxy programmait).
# - kind : le nom du conteneur du control-plane
# - k3s  : 127.0.0.1 / 6443
# - kubeadm : l'IP ou le VIP du control-plane
k8sServiceHost: kind-control-plane
k8sServicePort: 6443

# PAS de bloc gatewayAPI.hostNetwork ici, et c'est une décision.
#
# Le mode host network répondait à une question précise : comment atteindre la
# Gateway depuis macOS sans LoadBalancer ni IP routable ? Envoy écoutait sur le
# réseau du nœud et kind publiait le port (extraPortMappings). Contreparties : un
# listener sous 1024 aurait exigé la capability NET_BIND_SERVICE, et le Service
# LoadBalancer disparaissait au profit d'un NodePort.
#
# Newt rend tout cela inutile. Le tunnel est SORTANT : le pod newt vit dans le
# cluster et joint la Gateway par son ClusterIP, comme n'importe quel pod. Plus
# rien n'a besoin d'être exposé sur le nœud ni publié vers l'hôte.
#
# Cilium recrée donc le Service LoadBalancer "cilium-gateway-platform". Sur kind
# son EXTERNAL-IP restera <pending>, faute de cloud provider : sans importance,
# c'est le ClusterIP que vise Newt. Son EndpointSlice ne contient qu'un endpoint
# sentinelle (192.192.192.192:9999) — le datapath BPF redirige le trafic vers
# Envoy sans passer par des endpoints réels, ce qui explique aussi pourquoi
# `kubectl port-forward` sur ce Service ne peut pas fonctionner.

# Mono-nœud : pas de raison de payer de la HA.
hubble:
  relay:
    replicas: 1

operator:
  replicas: 1
