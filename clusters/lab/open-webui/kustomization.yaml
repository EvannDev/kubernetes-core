apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../../base/open-webui

patches:
- target:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: open-webui
  patch: |
    - op: replace
      path: /spec/hostnames/0
      value: openwebui.127.0.0.1.nip.io
