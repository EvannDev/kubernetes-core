apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Aucun delta pour le lab. Le dashboard et l'ExternalSecret ne dépendent pas du
# domaine public : c'est le fichier de values
# (clusters/lab/values/kube-prometheus-stack.yaml) qui porte l'URL de Grafana et
# l'issuer Keycloak, et la HTTPRoute vit avec les autres dans
# base/platform-gateway/.
resources:
- ../../../base/kube-prometheus-stack
