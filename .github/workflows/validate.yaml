# Le ebook (§4.3) insiste sur la démarcation : la CI valide, elle ne déploie
# pas. Ce workflow ne touche jamais un cluster — il rend les manifests et
# vérifie leur schéma, pour attraper les erreurs AVANT le merge, pas au sync.
name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  kustomize:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Installer kustomize et kubeconform
      run: |
        curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz" | tar xz -C /usr/local/bin kustomize
        curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform

    - name: kustomize build + validation de schéma
      run: |
        set -euo pipefail
        for d in bootstrap projects \
                 base/external-secrets base/keycloak base/platform-gateway base/agentgateway \
                 clusters/*/platform clusters/*/cluster-dns \
                 clusters/*/external-secrets clusters/*/keycloak \
                 clusters/*/platform-gateway clusters/*/agentgateway \
                 apps/*; do
          [ -f "$d/kustomization.yaml" ] || continue
          echo "::group::$d"
          kustomize build "$d" | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.34.0 -
          echo "::endgroup::"
        done

    # kubeconform ignore les CRD qu'il ne connaît pas, et ne sait de toute façon
    # pas évaluer les règles CEL (x-kubernetes-validations). Or c'est là que se
    # cachent les vrais invariants : « traffic ne peut cibler qu'une Gateway ou
    # une Route », « backend.mcp ne peut pas cibler un Service »... Sans cette
    # étape, l'erreur n'apparaît qu'au sync, dans le cluster.
    - name: Valider les CR contre les CRD upstream (schéma + CEL)
      run: |
        pip install --quiet pyyaml jsonschema cel-python
        python3 hack/validate-crs.py \
          bootstrap projects \
          base/external-secrets base/keycloak base/platform-gateway base/agentgateway \
          clusters/*/platform clusters/*/cluster-dns \
          clusters/*/external-secrets clusters/*/keycloak \
          clusters/*/platform-gateway clusters/*/agentgateway \
          apps/*

    - name: Aucun Secret en clair dans Git
      run: |
        if git grep -nE '^kind:[[:space:]]*Secret$' -- '*.yaml' '*.yml'; then
          echo "::error::Un objet Secret est commité. Utiliser un ExternalSecret."
          exit 1
        fi
