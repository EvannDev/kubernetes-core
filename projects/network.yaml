# network : CNI (Cilium), CRD Gateway API partagées et routage north-south de
# la plateforme (Gateway de classe "cilium" + HTTPRoute Argo CD / Keycloak).
#
# Les CRD Gateway API sont volontairement dans CE projet et nulle part ailleurs :
# elles ont un propriétaire unique (cf. ARCHITECTURE.md).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: network
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  description: CNI, CRD Gateway API et routage de plateforme

  sourceRepos:
  - https://github.com/EvannDev/kubernetes-core.git
  - https://github.com/kubernetes-sigs/gateway-api.git
  - https://helm.cilium.io
  # Miroir OCI officiel, autorisé pour un éventuel basculement (airgap).
  - quay.io/cilium/charts

  destinations:
  - server: https://kubernetes.default.svc
    namespace: kube-system
  - server: https://kubernetes.default.svc
    namespace: platform-gateway
  # Les HTTPRoute vivent dans le namespace du Service qu'elles exposent.
  - server: https://kubernetes.default.svc
    namespace: argocd
  - server: https://kubernetes.default.svc
    namespace: keycloak
  # Le chart Cilium y dépose les secrets TLS des Gateway.
  - server: https://kubernetes.default.svc
    namespace: cilium-secrets

  clusterResourceWhitelist:
  - group: ""
    kind: Namespace
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
  - group: admissionregistration.k8s.io
    kind: MutatingWebhookConfiguration
  # Gateway API v1.6 embarque une ValidatingAdmissionPolicy (safe upgrades).
  - group: admissionregistration.k8s.io
    kind: ValidatingAdmissionPolicy
  - group: admissionregistration.k8s.io
    kind: ValidatingAdmissionPolicyBinding
  - group: gateway.networking.k8s.io
    kind: GatewayClass
  - group: cilium.io
    kind: CiliumClusterwideNetworkPolicy
  - group: cilium.io
    kind: CiliumLoadBalancerIPPool
  - group: cilium.io
    kind: CiliumL2AnnouncementPolicy

  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
