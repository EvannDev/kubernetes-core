# identity : la chaîne d'identité et de secrets — External Secrets Operator et
# Keycloak (opérateur + realm). C'est ce projet qui a le droit de créer des
# Secrets ; aucun autre n'en a besoin.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: identity
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  description: External Secrets Operator et Keycloak

  sourceRepos:
  - https://github.com/EvannDev/kubernetes-core.git
  - https://charts.external-secrets.io
  - https://github.com/keycloak/keycloak-k8s-resources.git

  destinations:
  - server: https://kubernetes.default.svc
    namespace: external-secrets
  - server: https://kubernetes.default.svc
    namespace: platform-secrets
  - server: https://kubernetes.default.svc
    namespace: keycloak
  # Pour l'ExternalSecret qui projette le client secret OIDC dans Argo CD
  # (variante "client confidentiel", cf. ARCHITECTURE.md).
  - server: https://kubernetes.default.svc
    namespace: argocd

  clusterResourceWhitelist:
  - group: ""
    kind: Namespace
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
  - group: admissionregistration.k8s.io
    kind: MutatingWebhookConfiguration
  - group: external-secrets.io
    kind: ClusterSecretStore
  - group: external-secrets.io
    kind: ClusterExternalSecret

  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
