# platform : le plan de contrôle GitOps lui-même (root, ApplicationSets,
# app-of-apps par cluster) et Argo CD auto-géré.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  description: Plan de controle GitOps et auto-gestion d'Argo CD

  sourceRepos:
  - https://github.com/EvannDev/kubernetes-core.git
  - https://argoproj.github.io/argo-helm

  destinations:
  - server: https://kubernetes.default.svc
    namespace: argocd

  clusterResourceWhitelist:
  - group: ""
    kind: Namespace
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding

  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
