apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-mcp
  namespace: argocd
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: ai
    namespace: agentgateway-system
    sectionName: http
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /argocd
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: argocd-mcp
