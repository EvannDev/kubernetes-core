# Token de compte Argo CD, projeté depuis le coffre.
#
# À produire une fois (cf. Makefile, cible seed-argocd-mcp-token) :
#   argocd account generate-token --account mcp
# Le compte `mcp` et sa capacité apiKey sont déclarés dans les values Argo CD,
# sa portée RBAC dans policy.csv — donc en Git, revus en pull request.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-mcp
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: argocd-mcp
    creationPolicy: Owner
  data:
  - secretKey: token
    remoteRef:
      key: argocd-mcp
      property: token
