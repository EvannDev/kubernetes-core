# Deuxième projection du même secret de coffre : celle-ci pour l'application.
# La première vit dans le namespace keycloak, pour le Job d'import de realm.
# Une source unique, deux consommateurs, zéro secret dans Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-oidc
  namespace: open-webui
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: open-webui-oidc
    creationPolicy: Owner
  data:
  - secretKey: clientSecret
    remoteRef:
      conversionStrategy: Default	
      decodingStrategy: None
      key: open-webui-oidc
      property: clientSecret
      metadataPolicy: None
