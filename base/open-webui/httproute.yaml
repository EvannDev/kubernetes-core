apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui
  namespace: open-webui
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: platform
    namespace: platform-gateway
    sectionName: http
  # PLACEHOLDER : surchargé par cluster.
  hostnames:
  - openwebui.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: open-webui
      port: 80
      weight: 1
