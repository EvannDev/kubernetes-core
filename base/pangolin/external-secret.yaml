# Projection des identifiants du site Newt depuis le coffre vers le namespace
# pangolin. Les trois noms de clés ne sont pas libres : le chart newt les câble
# tels quels en secretKeyRef (cf. newtInstances[].auth.keys, dont les défauts
# sont PANGOLIN_ENDPOINT / NEWT_ID / NEWT_SECRET). secretKey et property doivent
# donc rester identiques de bout en bout, du `make seed-secrets` au conteneur.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: newt-main-tunnel-auth
  namespace: pangolin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: newt-main-tunnel-auth
    creationPolicy: Owner
  data:
  - secretKey: PANGOLIN_ENDPOINT
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: newt-main-tunnel-auth
      property: PANGOLIN_ENDPOINT
      metadataPolicy: None
  - secretKey: NEWT_ID
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: newt-main-tunnel-auth
      property: NEWT_ID
      metadataPolicy: None
  - secretKey: NEWT_SECRET
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: newt-main-tunnel-auth
      property: NEWT_SECRET
      metadataPolicy: None
