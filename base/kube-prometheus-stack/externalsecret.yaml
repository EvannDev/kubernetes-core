# Client secret OIDC de Grafana, projeté depuis le coffre.
#
# Deuxième projection du même secret : l'autre vit dans le namespace keycloak,
# pour le Job d'import de realm qui substitue ${GRAFANA_CLIENT_SECRET}. Une
# source unique, deux consommateurs, zéro secret dans Git — le pattern exact
# d'open-webui-oidc.
#
# Ce n'est pas une préférence de style : la CI échoue sur tout `kind: Secret`
# commité (.github/workflows/validate.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: grafana-oidc
    creationPolicy: Owner
  data:
  - secretKey: clientSecret
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: grafana-oidc
      property: clientSecret
      metadataPolicy: None
  # Compte admin local de Grafana : l'issue de secours quand le SSO casse.
  # Mêmes noms de clés que ceux attendus par grafana.admin.{userKey,passwordKey}.
  - secretKey: admin-user
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: grafana-oidc
      property: adminUser
      metadataPolicy: None
  - secretKey: admin-password
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: grafana-oidc
      property: adminPassword
      metadataPolicy: None
