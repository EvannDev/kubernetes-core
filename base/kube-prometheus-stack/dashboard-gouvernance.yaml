          "title": "Experience : ce que l utilisateur ressent",
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 24,
            "h": 1
          },
          "id": 30,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Time to first token (p95)",
          "description": "L ecart entre un 8B local et un modele distant se voit ici. ATTENTION : cette metrique n est alimentee QUE par les requetes en streaming (verifie sur le cluster) — un appel non-streaming laisse le panneau vide. Open WebUI streame par defaut, donc l usage reel la remplit.",
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 7
          },
          "id": 31,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
