            }
          },
          "targets": [
            {
              "expr": "sum by (gen_ai_request_model, gen_ai_token_type) (rate(agentgateway_gen_ai_client_token_usage_sum[5m]))",
              "legendFormat": "{{gen_ai_request_model}} / {{gen_ai_token_type}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "row",
          "title": "Gouvernance : ce qui est refuse",
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 24,
            "h": 1
          },
          "id": 20,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Requetes refusees par la passerelle",
          "description": "401 = pas de JWT valide (policy ai-authn). 403 = Model authorization denied, la regle portee par l AgentgatewayModel. LIMITE VERIFIEE SUR LE CLUSTER : sur un refus, les labels `user` et `team` valent `unknown` — la requete est rejetee avant que le contexte JWT ne soit disponible pour les labels de metriques. On sait donc COMBIEN de refus et de quel type, pas QUI. Pour attribuer un refus a une personne, ce sont les access logs qu il faut lire : la policy ai-observability y ajoute jwt.subject et jwt.groups.",
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 6
          },
          "id": 21,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
