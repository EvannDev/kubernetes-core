# LE DASHBOARD QUE LE CHART NE PEUT PAS FOURNIR.
#
# Le chart agentgateway livre déjà son propre dashboard (38 ko, activé par
# monitoring.grafanaDashboard) : consommation de tokens, coût en USD, time to
# first token, appels d'outils MCP, latence par route. Il est très bien, et il
# est repris tel quel — inutile de le réécrire.
#
# Ce qu'il ne PEUT pas montrer, c'est QUI. Les métriques natives d'agentgateway
# ne portent aucun label d'identité : on découpe par modèle, par fournisseur et
# par statut, jamais par personne. Les labels `user` et `team` sont ajoutés par
# la policy ai-observability (base/agentgateway/policy-observability.yaml,
# bloc frontend.metrics) — sans elle, la moitié de ces panneaux reste vide.
#
# C'est le dashboard du Lunch & Learn : « qui a brûlé le budget », « combien
# tourne en local plutôt qu'en facturé », et « qu'est-ce que la passerelle a
# refusé ». Trois questions qu'aucune application ne sait documenter seule.
#
# DEUX VARIABLES, ET ELLES SERVENT VRAIMENT. `team` puis `user`, en cascade :
# la requete de `user` porte {team=~"$team"}, donc choisir une equipe restreint
# la liste des personnes proposees. Les deux sont multi-select avec allValue
# ".*" — c'est ce qui permet d'ecrire {user=~"$user", team=~"$team"} dans TOUS
# les panneaux sans casser la vue « tout le monde ».
#
# Le selecteur est pose partout, y compris sur les panneaux « souverainete » et
# « experience » : la question interessante n'est pas seulement « combien tourne
# en local » mais « combien de MA consommation tourne en local ». Tous les
# histogrammes (_bucket) portent aussi les deux labels, verifie sur le data
# plane — le filtre y est donc valide.
#
# UNE EXCEPTION A CONNAITRE : un refus 401 ne porte pas d'identite (la requete
# est rejetee avant validation du JWT, donc user et team valent `unknown`).
# Restreindre le filtre a une personne vide donc le panneau des refus. C'est
# correct, et c'est ecrit dans la description du panneau pour que personne ne
# le prenne pour une regression.
#
# Le sidecar de Grafana ramasse ce ConfigMap par son label grafana_dashboard,
# dans n'importe quel namespace (searchNamespace: ALL).
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-gouvernance-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  agentgateway-gouvernance.json: |
    {
      "uid": "agentgateway-gouvernance",
      "title": "AgentGateway — Gouvernance IA",
      "tags": [
        "agentgateway",
        "gouvernance",
        "llm"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "30s",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "label": "Source"
          },
          {
            "name": "team",
            "type": "query",
            "label": "Equipe",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": "label_values(agentgateway_gen_ai_client_token_usage_sum, team)",
            "description": "Valeur `sans-groupe` = jeton valide dont le claim `groups` est absent (session SSO ouverte avant l'affectation au groupe).",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "user",
            "type": "query",
            "label": "Utilisateur",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": "label_values(agentgateway_gen_ai_client_token_usage_sum{team=~\"$team\"}, user)",
            "description": "La liste est filtree par l'equipe selectionnee : choisir une equipe restreint les utilisateurs proposes.",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Qui consomme",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "id": 1,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "stat",
          "title": "Tokens par utilisateur (1 h)",
          "description": "La question que personne ne sait repondre sans passerelle : qui a consomme quoi. Le label `user` vient de jwt.preferred_username, ajoute par la policy ai-observability.",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 6
          },
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "colorMode": "value"
          },
          "targets": [
            {
              "expr": "sum by (user) (increase(agentgateway_gen_ai_client_token_usage_sum{user=~\"$user\", team=~\"$team\"}[1h]))",
              "legendFormat": "{{user}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Debit de tokens par utilisateur",
          "description": "",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 6
          },
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 40,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (user) (rate(agentgateway_gen_ai_client_token_usage_sum{user=~\"$user\", team=~\"$team\"}[5m]))",
              "legendFormat": "{{user}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Par equipe",
          "description": "Filtre par utilisateur ET par equipe : selectionner une seule personne laisse une seule serie, celle de son equipe.",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 6
          },
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 40,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (team) (rate(agentgateway_gen_ai_client_token_usage_sum{user=~\"$user\", team=~\"$team\"}[5m]))",
              "legendFormat": "{{team}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "row",
          "title": "Souverainete : local contre facture",
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 24,
            "h": 1
          },
          "id": 10,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "stat",
          "title": "Tokens locaux vs factures (1 h)",
          "description": "Le filtre s'applique aussi ici : « combien MA consommation tourne en local plutot qu'en facture ».",
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 6,
            "h": 6
          },
          "id": 11,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "colorMode": "value"
          },
          "targets": [
            {
              "expr": "sum by (gen_ai_system) (increase(agentgateway_gen_ai_client_token_usage_sum{user=~\"$user\", team=~\"$team\"}[1h]))",
              "legendFormat": "{{gen_ai_system}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Debit par fournisseur",
          "description": "",
          "gridPos": {
            "x": 7,
            "y": 6,
            "w": 9,
            "h": 6
          },
          "id": 12,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 40,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (gen_ai_system) (rate(agentgateway_gen_ai_client_token_usage_sum{user=~\"$user\", team=~\"$team\"}[5m]))",
              "legendFormat": "{{gen_ai_system}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Tokens par modele et par type",
          "description": "",
          "gridPos": {
            "x": 16,
            "y": 6,
            "w": 8,
            "h": 6
          },
          "id": 13,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (gen_ai_request_model, gen_ai_token_type) (rate(agentgateway_gen_ai_client_token_usage_sum{user=~\"$user\", team=~\"$team\"}[5m]))",
              "legendFormat": "{{gen_ai_request_model}} / {{gen_ai_token_type}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "row",
          "title": "Gouvernance : ce qui est refuse",
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 24,
            "h": 1
          },
          "id": 20,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Requetes refusees par la passerelle",
          "description": "Un refus 401 ne porte pas d'identite : la requete est rejetee avant que le JWT ne soit valide, donc user et team valent `unknown`. Restreindre le filtre a une personne vide donc ce panneau — c'est correct, pas une regression. Pour attribuer un refus, lire les access logs, qui portent jwt.subject.",
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 6
          },
          "id": 21,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (status, reason) (increase(agentgateway_requests_total{status=~\"401|403\", user=~\"$user\", team=~\"$team\"}[$__rate_interval]))",
              "legendFormat": "{{status}} — {{reason}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Requetes par statut",
          "description": "Un refus 401 ne porte pas d'identite : la requete est rejetee avant que le JWT ne soit valide, donc user et team valent `unknown`. Restreindre le filtre a une personne vide donc ce panneau — c'est correct, pas une regression. Pour attribuer un refus, lire les access logs, qui portent jwt.subject.",
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 6
          },
          "id": 22,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 40,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (status) (rate(agentgateway_requests_total{user=~\"$user\", team=~\"$team\"}[5m]))",
              "legendFormat": "{{status}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "row",
          "title": "Experience : ce que l utilisateur ressent",
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 24,
            "h": 1
          },
          "id": 30,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Time to first token (p95)",
          "description": "Alimente uniquement par les requetes en streaming.",
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 7
          },
          "id": 31,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, gen_ai_request_model) (rate(agentgateway_gen_ai_server_time_to_first_token_bucket{user=~\"$user\", team=~\"$team\"}[5m])))",
              "legendFormat": "{{gen_ai_request_model}}",
              "refId": "A",
