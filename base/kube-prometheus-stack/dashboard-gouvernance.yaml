        {
          "type": "timeseries",
          "title": "Duree de requete (p95)",
          "description": "",
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 7
          },
          "id": 32,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
