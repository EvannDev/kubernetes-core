# LE DASHBOARD QUE LE CHART NE PEUT PAS FOURNIR.
#
# Le chart agentgateway livre déjà son propre dashboard (38 ko, activé par
# monitoring.grafanaDashboard) : consommation de tokens, coût en USD, time to
# first token, appels d'outils MCP, latence par route. Il est très bien, et il
# est repris tel quel — inutile de le réécrire.
#
# Ce qu'il ne PEUT pas montrer, c'est QUI. Les métriques natives d'agentgateway
# ne portent aucun label d'identité : on découpe par modèle, par fournisseur et
# par statut, jamais par personne. Les labels `user` et `team` sont ajoutés par
# la policy ai-observability (base/agentgateway/policy-observability.yaml,
# bloc frontend.metrics) — sans elle, la moitié de ces panneaux reste vide.
#
# C'est le dashboard du Lunch & Learn : « qui a brûlé le budget », « combien
# tourne en local plutôt qu'en facturé », et « qu'est-ce que la passerelle a
# refusé ». Trois questions qu'aucune application ne sait documenter seule.
#
# Le sidecar de Grafana ramasse ce ConfigMap par son label grafana_dashboard,
# dans n'importe quel namespace (searchNamespace: ALL).
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-gouvernance-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  agentgateway-gouvernance.json: |
    {
      "uid": "agentgateway-gouvernance",
      "title": "AgentGateway — Gouvernance IA",
      "tags": [
        "agentgateway",
        "gouvernance",
        "llm"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "label": "Source"
          },
          {
            "name": "user",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": "label_values(agentgateway_gen_ai_client_token_usage_sum, user)",
            "multi": true,
            "includeAll": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "label": "Utilisateur"
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Qui consomme",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "id": 1,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "stat",
          "title": "Tokens par utilisateur (1 h)",
          "description": "La question que personne ne sait repondre sans passerelle : qui a consomme quoi. Le label `user` vient de jwt.preferred_username, ajoute par la policy ai-observability.",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 6
          },
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "colorMode": "value"
          },
          "targets": [
            {
              "expr": "sum by (user) (increase(agentgateway_gen_ai_client_token_usage_sum[1h]))",
              "legendFormat": "{{user}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Debit de tokens par utilisateur",
          "description": "",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 6
          },
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 40,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (user) (rate(agentgateway_gen_ai_client_token_usage_sum[5m]))",
              "legendFormat": "{{user}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Par equipe",
          "description": "team est derive des groupes Keycloak. En production on ne garderait que ce label : `user` explose la cardinalite.",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 6
          },
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 40,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (team) (rate(agentgateway_gen_ai_client_token_usage_sum[5m]))",
              "legendFormat": "{{team}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "row",
          "title": "Souverainete : local contre facture",
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 24,
            "h": 1
          },
          "id": 10,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "stat",
          "title": "Tokens locaux vs factures (1 h)",
          "description": "ollama = tourne sur la machine, cout zero. openai = facture au token. Le meme catalogue, la meme passerelle, deux economies.",
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 6,
            "h": 6
          },
          "id": 11,
          "datasource": {
            "type": "prometheus",
