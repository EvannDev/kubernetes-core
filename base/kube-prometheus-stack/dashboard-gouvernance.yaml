              "unit": "short",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "colorMode": "value"
          },
          "targets": [
            {
              "expr": "sum by (gen_ai_system) (increase(agentgateway_gen_ai_client_token_usage_sum[1h]))",
              "legendFormat": "{{gen_ai_system}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Debit par fournisseur",
          "description": "",
          "gridPos": {
            "x": 7,
            "y": 6,
            "w": 9,
            "h": 6
          },
          "id": 12,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
