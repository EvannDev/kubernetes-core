              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (gen_ai_system) (rate(agentgateway_gen_ai_client_token_usage_sum[5m]))",
