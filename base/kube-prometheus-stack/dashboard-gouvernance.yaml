              "calcs": [
                "sum",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (status, reason) (increase(agentgateway_requests_total{status=~\"401|403\"}[$__rate_interval]))",
              "legendFormat": "{{status}} — {{reason}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Requetes par statut",
          "description": "",
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 6
          },
          "id": 22,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
