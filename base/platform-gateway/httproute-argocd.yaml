apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
  - group: gateway.networking.k8s.io	
    kind: Gateway
    name: platform
    namespace: platform-gateway
    sectionName: http
  # PLACEHOLDER : surchargé par cluster.
  hostnames:
  - argocd.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    # server.insecure=true : argocd-server écoute en clair sur 80.
    - name: argocd-server
      port: 80
