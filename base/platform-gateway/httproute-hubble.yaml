---
# base/platform-gateway/httproute-hubble.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
  namespace: kube-system        # imposé par le Service, pas par la Gateway
spec:
  parentRefs:
  - group: gateway.networking.k8s.io	
    kind: Gateway
    name: platform
    namespace: platform-gateway
    sectionName: http
  hostnames:
  - hubble.example.com          # PLACEHOLDER, patché par cluster
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ''	
      kind: Service
      name: hubble-ui
      port: 8081
      weight: 1