# Gateway de PLATEFORME — classe "cilium".
#
# Deux GatewayClass cohabitent volontairement dans ce cluster :
#   cilium       -> trafic north-south classique (UI Argo CD, Keycloak)
#   agentgateway -> trafic IA (LLM, MCP, A2A), là où vit la gouvernance
#
# La coexistence est propre parce que :
#  - aucun des deux contrôleurs n'installe les CRD Gateway API (un seul
#    propriétaire : l'Application "gateway-api") ;
#  - les controllerName sont disjoints (io.cilium/gateway-controller vs
#    agentgateway.dev/agentgateway) donc chacun ignore les Gateway de l'autre.
#
# Cilium crée le Service LoadBalancer "cilium-gateway-platform" dans ce
# namespace. Sans cloud provider (kind), son EXTERNAL-IP reste <pending>, ce qui
# ne gêne personne : le pod newt le joint par son ClusterIP depuis l'intérieur
# du cluster, et c'est Pangolin qui l'expose vers Internet. Le port-forward,
# lui, ne fonctionnera jamais sur ce Service — il n'a aucun pod derrière,
# seulement l'endpoint sentinelle du datapath BPF (cf. ARCHITECTURE.md §8.1).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: platform-gateway
spec:
  gatewayClassName: cilium
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        # Les HTTPRoute vivent avec leur Service, donc dans d'autres namespaces.
        from: All
