# Valeurs Cilium COMMUNES à tous les clusters.
# Tout ce qui dépend d'un cluster (adresse de l'API server, MTU, pool d'IP...)
# va dans clusters/<cluster>/values/cilium.yaml, qui est appliqué APRÈS ce
# fichier (Argo CD fusionne les valueFiles dans l'ordre déclaré).

# Cilium remplace kube-proxy : le cluster doit être créé sans kube-proxy.
kubeProxyReplacement: true

ipam:
  mode: kubernetes

# Gateway API : Cilium fournit la GatewayClass "cilium" pour le trafic
# north-south classique de la plateforme (UI Argo CD, Keycloak).
# AgentGateway fournit la GatewayClass "agentgateway" pour le trafic IA.
# Les deux coexistent : contrôleurs distincts, controllerName distincts, et
# AUCUN des deux n'installe les CRD Gateway API (c'est l'app "gateway-api" qui
# en est le propriétaire unique).
gatewayAPI:
  enabled: true

l7Proxy: true

# Observabilité réseau : indispensable pour montrer "qui parle à qui" quand on
# raconte une histoire de gouvernance.
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
    - dns
    - drop
    - tcp
    - flow
    - httpV2

# Mettre à true une fois kube-prometheus-stack en place.
prometheus:
  enabled: false
operator:
  prometheus:
    enabled: false
