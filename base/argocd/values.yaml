# Valeurs argo-cd COMMUNES.
# Le domaine, l'URL et l'issuer OIDC sont propres au cluster :
# clusters/<cluster>/values/argocd.yaml.

# Dex n'est pas utilisé : on branche Argo CD directement sur Keycloak via
# oidc.config. Un pod de moins et une couche de moins à déboguer.
dex:
  enabled: false

configs:
  cm:
    # Compte de service pour le serveur MCP Argo CD. `apiKey` autorise la
    # génération d'un token d'API sans mot de passe ni session.
    # Le token lui-même n'est PAS ici : il est produit une fois hors GitOps,
    # déposé dans le coffre, et projeté par External Secrets.
    accounts.mcp: apiKey

    # Garder le compte admin local comme issue de secours : une oidc.config
    # invalide rend sinon l'UI inaccessible.
    admin.enabled: true
    exec.enabled: false
    # Autoriser Kustomize à rendre les charts Helm déclarés via helmCharts:
    # (non utilisé ici, mais évite une surprise si on en ajoute).
    kustomize.buildOptions: --enable-helm

  rbac:
    # Par défaut : lecture seule. L'appartenance à un groupe Keycloak est la
    # seule façon d'obtenir plus.
    policy.default: role:readonly
    # Le nom doit correspondre EXACTEMENT au claim "groups" du token.
    # Le mapper Keycloak est configuré avec full.path=false, donc pas de "/".
    policy.csv: |
      g, platform-admins, role:admin
      g, platform-viewers, role:readonly

      # Plafond du serveur MCP. Ce compte porte l'identité UNIQUE avec laquelle
      # le serveur MCP parle à Argo CD : la distinction admin / lecteur se fait
      # à la passerelle, pas ici. Cette RBAC est donc un PLAFOND grossier — ce
      # que le serveur pourrait faire au pire — et non un contrôle par
      # utilisateur. Le restreindre reste utile : c'est la seconde barrière si
      # la policy de la passerelle était mal écrite.
      p, role:mcp, applications, get, */*, allow
      p, role:mcp, applications, sync, */*, allow
      p, role:mcp, applications, create, */*, allow
      p, role:mcp, applications, update, */*, allow
      p, role:mcp, applications, delete, */*, allow
      p, role:mcp, applications, action/*, */*, allow
      p, role:mcp, logs, get, */*, allow
      p, role:mcp, clusters, get, *, allow
      p, role:mcp, projects, get, *, allow
      g, mcp, role:mcp
    scopes: "[groups]"

  params:
    # TLS terminé par la Gateway : le serveur Argo CD parle en clair derrière.
    server.insecure: true
    # Voir ARCHITECTURE.md : les clés de argocd-cmd-params-cm sont consommées
    # comme arguments du conteneur, donc un changement ici implique un
    # redémarrage du pod argocd-server (contrairement à argocd-cm).

controller:
  metrics:
    enabled: false
server:
  metrics:
    enabled: false
repoServer:
  metrics:
    enabled: false
