# Client secret OIDC de Grafana, projeté dans le namespace keycloak.
#
# Contrainte de l'opérateur : le Secret référencé par spec.placeholders doit
# être dans le MÊME namespace que le CR Keycloak. D'où cette seconde projection,
# en plus de celle du namespace monitoring — exactement comme open-webui-oidc.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: grafana-oidc
    creationPolicy: Owner
  data:
  - secretKey: clientSecret
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: grafana-oidc
      property: clientSecret
      metadataPolicy: None
