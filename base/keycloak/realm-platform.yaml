# Realm "platform" : la source d'identité de la plateforme.
#
# LIMITE IMPORTANTE de KeycloakRealmImport : le CR ne fait que CRÉER. Si le
# realm existe déjà côté Keycloak, il n'est PAS mis à jour. Modifier ce fichier
# et laisser Argo CD synchroniser est donc un no-op sur un realm déjà importé.
# Pour itérer : supprimer le realm dans Keycloak (ou le PVC Postgres) et laisser
# le Job d'import se relancer.
# Alternatives réconciliantes, cf. ARCHITECTURE.md :
#   - keycloak-config-cli en Job PostSync (réconciliation complète)
#   - les CR KeycloakOIDCClient / KeycloakSAMLClient (nouveaux en 26.7, expérimentaux)
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: platform
  namespace: keycloak
spec:
  keycloakCRName: kc

  # Injection de secrets dans l'import, sans jamais les écrire dans Git.
  #
  # Mécanisme réel, vérifié dans l'opérateur
  # (KeycloakRealmImportJobDependentResource) : chaque entrée devient une
  # VARIABLE D'ENVIRONNEMENT du Job d'import, alimentée par un Secret. Keycloak
  # remplace ensuite les placeholders `${NOM}` dans le JSON du realm.
  #
  # Attention à la syntaxe : c'est bien `${NOM}` — et non `$(env:NOM)` que l'on
  # lit souvent. Source : guide serveur « Using Environment Variables within the
  # Realm Configuration Files ».
  #
  # Contrainte : le Secret doit être dans le MÊME namespace que le CR Keycloak.
  # D'où l'ExternalSecret `open-webui-oidc` déployé ici, en plus de celui du
  # namespace open-webui.
  placeholders:
    OPENWEBUI_CLIENT_SECRET:
      secret:
        name: open-webui-oidc
        key: clientSecret

  realm:
    realm: platform
    displayName: Platform
    enabled: true
    sslRequired: none          # LAB uniquement : mettre "external" ailleurs.
    registrationAllowed: false

    # LAB uniquement. Par défaut un access token vit 300 s, ce qui est sain mais
    # pénible quand on colle un token dans une variable d'environnement pour la
    # démo LLM. Le flux OAuth de MCP, lui, rafraîchit tout seul et n'a pas
    # besoin de ça.
    accessTokenLifespan: 3600
    ssoSessionIdleTimeout: 28800

    # ═══ SANS CETTE LIGNE, RIEN NE MARCHE ═══════════════════════════════════
    # Déclarer `clientScopes` ci-dessous DÉSACTIVE la création des client
    # scopes intégrés de Keycloak (profile, email, roles, web-origins, acr,
    # basic, address, phone, microprofile-jwt).
    #
    # RealmManager.java (26.7.1) :
    #
    #   private boolean isCreateDefaultClientScopes(RealmRepresentation rep) {
    #       Map<String, String> attributes = rep.getAttributesOrEmpty();
    #       String createDefaultClientScopes = attributes.remove(CREATE_DEFAULT_CLIENT_SCOPES);
    #       return rep.getClientScopes() == null || Boolean.parseBoolean(createDefaultClientScopes);
    #   }
    #
    #   if (isCreateDefaultClientScopes(rep)) { createDefaultClientScopes(realm); }
    #   RepresentationToModel.importRealm(session, rep, realm, userImport);
    #
    # C'est du tout ou rien : soit on ne déclare aucun scope et on hérite des
    # intégrés, soit on en déclare un seul et on perd TOUS les intégrés.
    # L'attribut ci-dessous est l'échappatoire officielle — il rétablit la
    # création des intégrés AVANT l'import des nôtres, donc sans conflit.
    # Il est consommé (`remove`) et n'est pas persisté comme attribut du realm.
    #
    # Symptôme si on l'oublie : Keycloak répond
    #   invalid_scope: Invalid scopes: openid profile email groups
    # parce que `profile` et `email` n'existent tout simplement pas. Le
    # document de découverte le trahit :
    #   "scopes_supported":["openid","agentgateway-audience","offline_access","groups"]
    # (offline_access survit car il est créé par un chemin distinct,
    #  setupOfflineTokens, indépendant de ce test.)
    attributes:
      CreateDefaultClientScopes: "true"

    # --- Groupes : la seule source d'autorisation -----------------------------
    # Repris tels quels dans le claim "groups" et donc dans policy.csv d'Argo CD
    # et dans les expressions CEL d'AgentGateway.
    groups:
    - name: platform-admins
    - name: platform-viewers

    # --- Client scopes --------------------------------------------------------
    clientScopes:
    # Keycloak n'envoie PAS les groupes par défaut : il faut un scope dédié avec
    # un group membership mapper. full.path=false pour ne pas préfixer par "/".
    - name: groups
      description: Appartenance aux groupes
      protocol: openid-connect
      attributes:
        include.in.token.scope: "true"
        display.on.consent.screen: "false"
      protocolMappers:
      - name: groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        config:
          claim.name: groups
          full.path: "false"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

    # Audience explicite pour AgentGateway : c'est ce que la passerelle vérifie
    # dans le claim "aud" (jwtAuthentication.providers[].audiences).
    - name: agentgateway-audience
      description: Audience AgentGateway
      protocol: openid-connect
      attributes:
        include.in.token.scope: "true"
        display.on.consent.screen: "false"
      protocolMappers:
      - name: agentgateway-audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        config:
          included.custom.audience: agentgateway
          id.token.claim: "false"
          access.token.claim: "true"

    # --- Clients -------------------------------------------------------------
    clients:
    # [index 0] Argo CD — client PUBLIC avec PKCE.
    # Aucun client secret : rien à provisionner dans argocd-secret, rien à
    # chiffrer, rien à faire tourner. C'est le mode recommandé pour une UI.
    - clientId: argocd
      name: Argo CD
      enabled: true
      protocol: openid-connect
      publicClient: true
      standardFlowEnabled: true
      directAccessGrantsEnabled: false
      attributes:
        pkce.code.challenge.method: S256
        post.logout.redirect.uris: "+"
      # PLACEHOLDERS : surchargés par cluster (clusters/<cluster>/keycloak).
      rootUrl: http://argocd.example.com
      redirectUris:
      - http://argocd.example.com/auth/callback
      - http://argocd.example.com/pkce/verify
      webOrigins:
      - http://argocd.example.com
      # Déclarer defaultClientScopes REMPLACE la liste par défaut du client :
      # tout ce qui n'est pas listé ici est retiré. Il faut donc réénumérer les
      # intégrés dont on a besoin, et pas seulement ajouter "groups".
      #
      # "openid" n'est PAS un client scope : c'est le scope protocolaire OIDC,
      # toujours implicite. Le mettre ici ne produit qu'un avertissement
      # "Referenced client scope doesn't exist" à l'import. On le demande
      # côté Argo CD (requestedScopes), pas ici.
      defaultClientScopes:
      - basic          # claims sub et auth_time
      - acr
      - profile
      - email
      - roles
      - web-origins
      - groups

    # [index 1] Open WebUI — client CONFIDENTIEL.
    #
    # Contrairement à Argo CD et opencode, Open WebUI est un serveur : il peut
    # garder un secret, et son implémentation OIDC en exige un. Le secret vient
    # du coffre via le placeholder déclaré plus haut.
    #
    # LE POINT QUI COMPTE POUR LA DÉMO : le scope `agentgateway-audience`.
    # Open WebUI ne fait pas d'OAuth « pour le provider » — il RETRANSMET le
    # token de sa propre session SSO vers l'endpoint LLM (auth_type:
    # system_oauth). Ce token est donc émis pour CE client, et son `aud` vaut ce
    # que ce client demande. Sans ce scope, la passerelle le rejette avec un
    # 401 parfaitement légitime et parfaitement incompréhensible.
    - clientId: open-webui
      name: Open WebUI
      enabled: true
      protocol: openid-connect
      publicClient: false
      clientAuthenticatorType: client-secret
      secret: ${OPENWEBUI_CLIENT_SECRET}
      standardFlowEnabled: true
      directAccessGrantsEnabled: false
      # PLACEHOLDERS : surchargés par cluster.
      rootUrl: http://openwebui.example.com
      redirectUris:
      - http://openwebui.example.com/oauth/oidc/callback
      webOrigins:
      - http://openwebui.example.com
      defaultClientScopes:
      - basic
      - acr
      - profile
      - email
      - roles
      - web-origins
      - groups
      - agentgateway-audience

    # [index 2] opencode — client OAuth d'un agent de code.
    #
    # C'est l'identifiant que la passerelle renvoie aux clients MCP qui tentent
    # un enregistrement dynamique (voir mcp.clientId dans la policy). Public +
    # PKCE : un agent qui tourne sur le poste d'un développeur ne peut pas
    # garder un secret, exactement comme une SPA.
    - clientId: opencode
      name: opencode (agent de code)
      enabled: true
      protocol: openid-connect
      publicClient: true
      standardFlowEnabled: true
      directAccessGrantsEnabled: false
      attributes:
        pkce.code.challenge.method: S256
      # LAB : opencode écoute sur un port de boucle locale choisi au moment du
      # flux, et sa documentation ne le fige pas. Un joker évite de deviner.
      # En production on épingle l'URI exacte — un redirect_uri trop large est
      # une vraie faille (vol de code d'autorisation).
      redirectUris:
      - http://localhost/*
      - http://127.0.0.1/*
      webOrigins:
      - http://localhost
      - http://127.0.0.1
      defaultClientScopes:
      - basic
      - acr
      - profile
      - email
      - roles
      - web-origins
      - groups                 # alimente jwt.groups, lu par le RBAC outil
      - agentgateway-audience  # alimente aud=agentgateway, exigé par la policy

    # [index 3] Client de démo pour AgentGateway : direct access grant, ce qui
    # permet d'obtenir un token en une commande curl pendant la présentation.
    # A ne JAMAIS activer sur un vrai IdP.
    - clientId: mcp-client
      name: MCP demo client
      enabled: true
      protocol: openid-connect
      publicClient: true
      standardFlowEnabled: false
      directAccessGrantsEnabled: true
      defaultClientScopes:
      - basic
      - acr
      - profile
      - email
      - roles
      - web-origins
      - groups
      - agentgateway-audience

    # --- Utilisateurs de démo ------------------------------------------------
    # LAB UNIQUEMENT. Des mots de passe en clair dans Git sont inacceptables
    # ailleurs : utiliser spec.placeholders (ESO -> Secret -> import) ou créer
    # les utilisateurs hors GitOps.
    users:
    - username: alice
      enabled: true
      email: alice@example.com
      emailVerified: true
      firstName: Alice
      lastName: Admin
      credentials:
      - type: password
        value: alice
        temporary: false
      groups:
      - /platform-admins
    - username: bob
      enabled: true
      email: bob@example.com
      emailVerified: true
      firstName: Bob
      lastName: Viewer
      credentials:
      - type: password
        value: bob
        temporary: false
      groups:
      - /platform-viewers
