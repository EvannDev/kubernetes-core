# Le client secret d'Open WebUI, côté Keycloak.
#
# Il est projeté ici parce que le Job d'import de realm ne peut lire que des
# Secrets de SON namespace. Le même secret est projeté une seconde fois dans le
# namespace open-webui pour l'application elle-même : une seule source dans le
# coffre, deux consommateurs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-oidc
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: open-webui-oidc
    creationPolicy: Owner
  data:
  - secretKey: clientSecret
    remoteRef:
      key: open-webui-oidc
      property: clientSecret
