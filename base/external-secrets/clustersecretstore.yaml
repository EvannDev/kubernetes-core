# ATTENTION à l'apiVersion : depuis External Secrets Operator 2.x, v1beta1
# n'est plus servie (served: false). Tout manifeste en external-secrets.io/v1beta1
# est rejeté par l'API server. C'est le piège n°1 quand on recopie un article
# de blog.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform
spec:
  provider:
    kubernetes:
      remoteNamespace: platform-secrets
      server:
        url: https://kubernetes.default
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          # namespace n'est autorisé (et requis) que dans un ClusterSecretStore.
          namespace: platform-secrets
      auth:
        serviceAccount:
          name: eso-platform-reader
          # Idem : obligatoire car le store est cluster-scoped.
          namespace: external-secrets
