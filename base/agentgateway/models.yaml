# ── Modèle ouvert à tous les porteurs d'un token valide ──────────────────────
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: gpt-4o-mini
  namespace: agentgateway-system
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: ai
    sectionName: http
  provider: OpenAI
  policies:
    auth:
      secretRef:
        name: openai-secret
    # Pas de bloc authorization : model_authorized() renvoie true quand aucune
    # règle n'est déclarée. L'authentification reste exigée par la policy
    # `ai-authn` posée sur la Gateway.
