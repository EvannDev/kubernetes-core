# Traçabilité au niveau de la Gateway : sans dépendance externe (pas de
# collecteur OTel requis pour les access logs).
#
# Pour les traces distribuées, ajouter un bloc frontend.tracing pointant sur un
# collecteur OTel (protocol: GRPC, port 4317) — volontairement absent ici pour
# ne pas créer une dépendance non déployée.
#
# Les métriques utiles côté coût sont exposées par le data plane sur :15020
#   agentgateway_gen_ai_client_token_usage{gen_ai_token_type="input|output",
#                                          gen_ai_request_model=...}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ai-observability
  namespace: agentgateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: ai

  frontend:
    # LABELS D'IDENTITÉ SUR LES MÉTRIQUES. Sans ce bloc, les métriques se
    # découpent par modèle, par provider et par statut — mais jamais par
    # personne. « Qui a brûlé le budget ? » restait donc une question d'access
    # logs, alors que c'est une question de tableau de bord.
    #
    # Les expressions sont évaluées par requête et ajoutées comme labels à
    # TOUTES les métriques Prometheus de la passerelle. Même mécanisme et même
    # syntaxe que le bloc accessLog ci-dessous.
    #
    # CARDINALITÉ — le CRD met en garde, et il a raison. Chaque valeur distincte
    # crée une série temporelle de plus, pour chaque métrique. Ici c'est borné :
    # deux comptes de démo, trois valeurs possibles de `team`. En production,
    # `user` sur un annuaire de plusieurs milliers de personnes ferait exploser
    # Prometheus : on ne garderait que `team`. Ce réglage ne se recopie pas tel
    # quel.
    #
    # `team` est réduit à UNE chaîne plutôt que la liste brute des groupes :
    # sérialiser une liste produirait un label différent par combinaison.
    #
    # CE QUE `unknown` VEUT DIRE. Un attribut dont l'expression ÉCHOUE est
    # silencieusement abandonné, et le label retombe sur `unknown`. Trois cas
    # produisent cette valeur, et un seul est un vrai trou d'attribution :
    #   - GET /v1/models  -> servi par le routeur interne, les attributs ne sont
    #                        pas évalués du tout. Structurel, aucune policy n'y
    #                        changera quoi que ce soit.
    #   - 401             -> pas de JWT validé, donc pas de `jwt`. Correct.
    #   - 429             -> les attributs SONT évalués (`user` est renseigné) :
    #                        ce n'est pas une perte d'attribution.
    metrics:
      attributes:
        add:
        - name: user
          # `preferred_username` et non `jwt.sub` : sub est l'UUID Keycloak
          # (f676468d-3be6-…), illisible sur un tableau de bord. L'access log
          # ci-dessous garde `sub`, qui reste l'identifiant stable pour l'audit
          # — un nom d'utilisateur peut être renommé, pas un sub.
          expression: 'jwt.preferred_username'
        - name: team
          # has() est la forme documentée pour tester la présence d'un claim :
          # depuis la v0.11, `jwt` n'est plus « toujours présent mais null », un
          # claim absent fait ÉCHOUER l'expression entière — y compris le
          # ternaire, dont la branche « faux » ne sera jamais atteinte.
          #
          # TROIS valeurs et non deux. `sans-groupe` désigne un jeton valide qui
          # ne porte pas le claim `groups` : typiquement une session SSO ouverte
          # AVANT l'affectation au groupe. Open WebUI retransmet le jeton stocké
          # à l'ouverture de session (auth_type: system_oauth) et ne le
          # rafraîchit pas ; le groupe ajouté après coup n'y figure jamais.
          # Replier ce cas sur `platform-viewers` compterait une session périmée
          # comme un viewer légitime — sur un tableau de bord de gouvernance,
          # c'est un mensonge. Mieux vaut que le trou se voie.
          expression: >-
            has(jwt.groups)
            ? (jwt.groups.exists(g, g == "platform-admins")
            ? "platform-admins" : "platform-viewers")
            : "sans-groupe"

    accessLog:
      attributes:
        add:
        - name: jwt.subject
          expression: 'jwt.sub'
        - name: jwt.groups
          # Même garde que ci-dessus, pour la même raison : sans has(), le champ
          # DISPARAÎT purement et simplement de la ligne de log quand le claim
          # manque. Un champ absent ne se remarque pas ; une valeur explicite,
          # si.
          expression: 'has(jwt.groups) ? jwt.groups : "sans-groupe"'
        - name: http.route
          expression: 'request.path'
