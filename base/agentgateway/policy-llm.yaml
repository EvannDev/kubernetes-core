# AUTHENTIFICATION À LA PORTE, autorisation au plus près de la ressource.
#
# Cette policy s'attache à la GATEWAY et non à une route : depuis le passage au
# catalogue AgentgatewayModel, il n'y a plus de HTTPRoute pour le trafic LLM —
# les modèles s'attachent directement au listener. Une policy de gateway couvre
# donc tout ce qui entre : LLM et MCP.
#
# Répartition des responsabilités qui en découle, et c'est la bonne :
#   ici                    -> QUI es-tu (JWT) et à quel débit
#   AgentgatewayModel      -> as-tu le droit d'utiliser CE modèle
#   AgentgatewayPolicy MCP -> as-tu le droit d'appeler CET outil
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ai-authn
  namespace: agentgateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: ai
    sectionName: http

  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
      # PLACEHOLDER : l'issuer est surchargé par cluster. Il doit correspondre
      # au claim "iss" au caractère près.
      - issuer: http://keycloak.example.com/realms/platform
        audiences:
        - agentgateway
        jwks:
          remote:
            # Par le Service interne : indépendant du DNS public et de la
            # Gateway de plateforme.
            backendRef:
              name: kc-service
              kind: Service
              namespace: keycloak
              port: 8080
            jwksPath: /realms/platform/protocol/openid-connect/certs
            cacheDuration: 5m

      # Découverte OAuth MCP (RFC 9728), désormais au niveau Gateway.
      #
      # Indispensable ici : quand le bloc `mcp` est présent, les endpoints
      # /.well-known/* échappent à la validation JWT (vérifié dans
      # JwtAuthentication::apply). Sans lui, une policy Strict sur la Gateway
      # rendrait la découverte impossible — il faudrait un token pour apprendre
      # comment en obtenir un.
      #
      # `resource` et `authorization_servers` sont calculés par la passerelle ;
      # les clés supplémentaires passent de camelCase à snake_case.
      mcp:
        provider: Keycloak
        # Court-circuite l'enregistrement dynamique de client : un agent ne peut
        # pas se fabriquer une identité, elle reste déclarée dans Git.
        clientId: opencode
        resourceMetadata:
          scopesSupported:
          - openid
          - groups
          - agentgateway-audience
          bearerMethodsSupported:
          - header

    # Garde-fou de coût, à l'échelle de la passerelle. AgentGateway sait aussi
    # limiter en TOKENS et pas seulement en requêtes, via rateLimit.global
    # (service RLS externe) : c'est la vraie réponse au « qui a brûlé le budget ».
    rateLimit:
      local:
      - requests: 10
        unit: Minutes
        burst: 5
