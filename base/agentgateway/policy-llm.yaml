# LE manifeste de gouvernance. Trois choses en un seul objet déclaratif,
# versionné, revu en pull request :
#
#  1. authentification — aucun appel LLM sans JWT Keycloak valide ;
#  2. autorisation     — expression CEL sur les claims du token ;
#  3. quota            — plafond de débit par la passerelle, pas par l'agent.
#
# C'est exactement ce que l'on ne peut PAS faire quand chaque application porte
# sa propre clé OpenAI dans un Secret.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: llm-governance
  namespace: agentgateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: llm

  traffic:
    jwtAuthentication:
      # Strict = un JWT valide est obligatoire.
      # Optional = validé s'il est présent ; Permissive = ne rejette jamais.
      mode: Strict
      providers:
      # PLACEHOLDER : l'issuer est surchargé par cluster
      # (clusters/<cluster>/agentgateway). Il doit correspondre au claim "iss"
      # au caractère près.
      - issuer: http://keycloak.example.com/realms/platform
        audiences:
        - agentgateway
        jwks:
          remote:
            # La récupération des clés se fait par le Service interne : elle ne
            # dépend donc pas de la Gateway de plateforme ni du DNS externe.
            backendRef:
              group: ''
              name: kc-service
              kind: Service
              namespace: keycloak
              port: 8080
            jwksPath: /realms/platform/protocol/openid-connect/certs
            cacheDuration: 5m

    # Autorisation par claim : seuls les membres du groupe platform-admins
    # peuvent consommer des tokens LLM.
    #
    # ATTENTION à la sémantique, vérifiée sur le schéma du CRD v1.4.1 :
    #  - les matchExpressions d'UNE règle sont en ET (toutes doivent être vraies) ;
    #  - plusieurs règles Allow, dans la même policy ou dans des policies
    #    différentes, sont fusionnées et se comportent en OU ;
    #  - dès qu'une règle Allow existe, tout ce qui ne matche pas est refusé.
    # Pour un OU à l'intérieur d'une règle, utiliser || dans l'expression CEL.
    #
    # Le bloc "authorization" est un frère de jwtAuthentication sous "traffic",
    # et non un champ du provider JWT.
    authorization:
      action: Allow
      policy:
        matchExpressions:
        - 'jwt.groups.exists(g, g == "platform-admins")'

    # Garde-fou de coût. AgentGateway sait aussi limiter en TOKENS et pas
    # seulement en requêtes, via rateLimit.global (nécessite un service RLS
    # externe) : c'est la vraie réponse au "qui a brûlé le budget ?".
    rateLimit:
      local:
      - requests: 10
        unit: Minutes
        burst: 5
