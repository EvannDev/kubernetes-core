# La clé d'API du fournisseur LLM ne quitte jamais la passerelle.
# Les agents n'ont plus besoin d'une clé : ils s'authentifient auprès
# d'AgentGateway avec un JWT Keycloak, et c'est la passerelle qui détient le
# secret. C'est tout l'argument de gouvernance : une clé, un point d'audit,
# une révocation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openai-secret
  namespace: agentgateway-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: openai-secret
    creationPolicy: Owner
  data:
  # Le nom de clé attendu par agentgateway est littéralement "Authorization".
  - secretKey: Authorization
    remoteRef:
      key: llm-openai
      property: apiKey
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: openai
  namespace: agentgateway-system
spec:
  ai:
    provider:
      openai: {}
  policies:
    auth:
      secretRef:
        name: openai-secret
    ai:
      routes:
        "/v1/responses": "Responses"
        "/v1/chat/completions": "Completions"
        "/v1/models": "Models"
        "*": "Passthrough"
