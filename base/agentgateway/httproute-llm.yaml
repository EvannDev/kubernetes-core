apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
  namespace: agentgateway-system
spec:
  parentRefs:
  # group/kind explicites : ce sont les valeurs par défaut, mais les écrire
  # évite d'avoir à s'en souvenir. Pas de namespace (la Gateway est dans le même
  # que la route) ni de sectionName (la route s'attache à tous les listeners).
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: ai
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1
    backendRefs:
    - name: openai
      namespace: agentgateway-system
      group: agentgateway.dev
      kind: AgentgatewayBackend
