# Cluster kind pour le lab.
#
# Deux réglages non négociables :
#  - disableDefaultCNI : sinon kindnet est installé et Cilium ne peut pas
#    prendre la main proprement ;
#  - kubeProxyMode: none : on utilise kubeProxyReplacement de Cilium.
#
# Conséquence du premier point : le cluster reste NotReady jusqu'à ce que Cilium
# soit déployé. C'est normal.
#
# PLUS D'extraPortMappings, et c'est le cœur du changement d'exposition.
# Tant que la Gateway était en host network, le port 8080 publié vers macOS
# était le SEUL chemin d'accès : le réseau Docker (172.18.0.0/16) n'est pas
# routable depuis l'hôte sur Docker Desktop.
#
# Newt inverse le sens du flux. Le tunnel est sortant : le pod newt joint la
# Gateway par son ClusterIP depuis l'intérieur du cluster, et c'est Pangolin qui
# publie vers Internet. Plus rien n'a besoin de traverser la frontière Docker,
# donc plus rien à mapper.
#
# À NOTER : extraPortMappings ne peut être ni ajouté ni retiré à chaud. Revenir
# sur cette décision impose un `make down && make up`.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kind
networking:
  disableDefaultCNI: true
  kubeProxyMode: none
nodes:
- role: control-plane
