# L'équipe applicative attache sa route à la Gateway IA, qui vit dans un autre
# namespace. C'est autorisé parce que la Gateway déclare
# allowedRoutes.namespaces.from: All — décision de plateforme, pas d'application.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  namespace: mcp-demo
spec:
  parentRefs:
  - group: gateway.networking.k8s.io	
    kind: Gateway
    name: ai
    namespace: agentgateway-system
    sectionName: http
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /mcp
    backendRefs:
    - name: mcp-website-fetcher
      group: agentgateway.dev
      kind: AgentgatewayBackend
      weight: 1
